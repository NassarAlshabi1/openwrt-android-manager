name: OpenWrt管家 - 云端编译

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_CMDLINE_TOOLS: '11076708'
  GRADLE_OPTS: '-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=true -Xmx4096m -XX:+UseParallelGC'
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==================== 第一步：磁盘清理 ====================
      - name: 清理磁盘空间
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用情况 ==="
          free -h
          echo ""

          echo "=== 删除不需要的大型工具 ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/*
          sudo rm -rf /usr/local/lib/android/sdk/platforms/*
          echo "大型工具删除完成"

          echo "=== 清理apt缓存 ==="
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "apt缓存清理完成"

          echo "=== 清理docker镜像 ==="
          docker system prune -af || true
          echo "docker镜像清理完成"

          echo ""
          echo "=== 清理后磁盘空间 ==="
          df -h
          echo ""
          echo "可用空间: $(df -h / | tail -1 | awk '{print $4}')"

      # ==================== 第二步：检出代码 ====================
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 显示提交信息
        run: |
          echo "提交哈希: ${{ github.sha }}"
          echo "提交信息: $(git log -1 --pretty=%B)"
          echo "提交作者: $(git log -1 --pretty=%an)"
          echo "提交时间: $(git log -1 --pretty=%ai)"

      # ==================== 第三步：设置 JDK ====================
      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: 验证 Java 环境
        run: |
          echo "=== Java 版本 ==="
          java -version
          echo ""
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo ""
          echo "=== 磁盘空间 ==="
          df -h /

      # ==================== 第四步：缓存配置 ====================
      - name: 缓存 Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/gradle.properties
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-
            ${{ runner.os }}-gradle-

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        id: android-sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-${{ env.ANDROID_CMDLINE_TOOLS }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}-
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-

      # ==================== 第五步：安装 Android SDK ====================
      - name: 安装 Android SDK
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          echo "=== 安装 Android Command-line Tools ==="
          # 先清理已存在的cmdline-tools，确保干净状态
          rm -rf $ANDROID_HOME/cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          
          # 重试下载命令行工具（最多3次）
          for i in 1 2 3; do
            echo "尝试第 $i 次下载命令行工具..."
            wget -q --timeout=120 "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -O cmdline-tools.zip && break
            echo "下载失败，5秒后重试..."
            sleep 5
          done
          
          if [ ! -f cmdline-tools.zip ]; then
            echo "❌ 命令行工具下载失败"
            exit 1
          fi
          
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          echo "Command-line Tools 安装完成"

          echo ""
          echo "=== 接受 SDK 许可 ==="
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          echo "许可接受完成"

          echo ""
          echo "=== 安装 SDK 组件 ==="
          # 重试安装SDK组件（最多3次）
          for i in 1 2 3; do
            echo "尝试第 $i 次安装SDK组件..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
              "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" && break
            echo "安装失败，10秒后重试..."
            sleep 10
          done
          echo "SDK 组件安装完成"

          echo ""
          echo "=== SDK 目录 ==="
          ls -la $ANDROID_HOME
          echo ""
          echo "=== 已安装平台 ==="
          ls -la $ANDROID_HOME/platforms/
          echo ""
          echo "=== 已安装构建工具 ==="
          ls -la $ANDROID_HOME/build-tools/

      - name: 配置 SDK 环境
        run: |
          echo "=== 验证 SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/
          ls $ANDROID_HOME/build-tools/
          ls $ANDROID_HOME/platform-tools/

          echo ""
          echo "=== 配置 local.properties ==="
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

          echo ""
          echo "=== 磁盘空间 ==="
          df -h /

      # ==================== 第六步：Gradle 配置 ====================
      - name: 配置 Gradle
        run: |
          echo "=== Gradle 配置 ==="
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << EOF
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
          org.gradle.configureondemand=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat ~/.gradle/gradle.properties

          echo ""
          echo "=== 赋予 gradlew 执行权限 ==="
          chmod +x gradlew
          ls -la gradlew

      # ==================== 第七步：编译前检查 ====================
      - name: 编译前环境检查
        run: |
          echo "========================================"
          echo "       编译前环境检查"
          echo "========================================"
          echo ""
          echo "=== Java ==="
          java -version
          echo ""
          echo "=== Gradle ==="
          ./gradlew --version
          echo ""
          echo "=== 磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用 ==="
          free -h
          echo ""
          echo "=== 项目结构 ==="
          find . -name "*.kt" | head -20
          echo ""
          echo "========================================"
          echo "       开始编译"
          echo "========================================"

      # ==================== 第八步：编译 APK ====================
      - name: 清理旧的构建输出
        run: |
          echo "=== 清理旧的构建输出 ==="
          ./gradlew clean
          echo "清理完成"
          echo ""
          echo "=== 磁盘空间 ==="
          df -h /

      - name: 编译 Debug APK
        id: build
        run: |
          ./gradlew assembleDebug \
            --info \
            --stacktrace \
            --no-daemon \
            --build-cache \
            2>&1 | tee build.log

          echo ""
          echo "=== 编译结果 ==="
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ 编译成功！"
            ls -lh app/build/outputs/apk/debug/
            echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" >> $GITHUB_ENV
          else
            echo "❌ Debug编译失败，APK文件未找到"
            exit 1
          fi

      - name: 运行单元测试
        run: |
          echo "=== 运行单元测试 ==="
          ./gradlew testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log
          echo "✅ 单元测试通过"

      - name: 编译 Release APK
        id: build_release
        run: |
          echo "=== 开始Release编译 ==="
          ./gradlew assembleRelease \
            --info \
            --stacktrace \
            --no-daemon \
            --build-cache \
            2>&1 | tee build_release.log

          echo ""
          echo "=== Release编译结果 ==="
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "✅ Release编译成功！(signed)"
            ls -lh app/build/outputs/apk/release/
            echo "RELEASE_APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release.apk)" >> $GITHUB_ENV
            echo "RELEASE_APK_FILE=app-release.apk" >> $GITHUB_ENV
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            echo "✅ Release编译成功！(unsigned)"
            ls -lh app/build/outputs/apk/release/
            echo "RELEASE_APK_SIZE=$(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)" >> $GITHUB_ENV
            echo "RELEASE_APK_FILE=app-release-unsigned.apk" >> $GITHUB_ENV
          else
            echo "❌ Release编译失败，APK文件未找到"
            ls -la app/build/outputs/apk/ 2>/dev/null || echo "无APK输出目录"
            exit 1
          fi

      - name: 编译失败时输出错误日志
        if: failure()
        run: |
          echo "========================================"
          echo "       编译失败 - 错误日志"
          echo "========================================"
          echo ""
          echo "=== 最后100行日志 ==="
          tail -100 build.log || true
          echo ""
          echo "=== 错误信息 ==="
          grep -i "error" build.log | tail -30 || true
          echo ""
          echo "=== 异常信息 ==="
          grep -i "exception" build.log | tail -20 || true
          echo ""
          echo "=== 磁盘空间 ==="
          df -h
          echo ""
          echo "=== 内存使用 ==="
          free -h

      # ==================== 第九步：重命名 APK ====================
      - name: 重命名 APK
        if: success()
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION_NAME="v2.5.0"
          APK_NAME="OpenWrtManager_${VERSION_NAME}_${SHORT_SHA}_debug.apk"
          RELEASE_APK_NAME="OpenWrtManager_${VERSION_NAME}_${SHORT_SHA}_release.apk"

          cp "app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/$APK_NAME"
          cp "app/build/outputs/apk/release/${RELEASE_APK_FILE}" "app/build/outputs/apk/release/$RELEASE_APK_NAME"

          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_PATH=app/build/outputs/apk/debug/$APK_NAME" >> $GITHUB_ENV
          echo "RELEASE_APK_NAME=$RELEASE_APK_NAME" >> $GITHUB_ENV
          echo "RELEASE_APK_PATH=app/build/outputs/apk/release/$RELEASE_APK_NAME" >> $GITHUB_ENV

          echo "Debug APK 文件名: $APK_NAME"
          echo "Release APK 文件名: $RELEASE_APK_NAME"
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      # ==================== 第十步：上传 Artifacts ====================
      - name: 上传 Debug APK 到 Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: 上传 Release APK 到 Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK_NAME }}
          path: ${{ env.RELEASE_APK_PATH }}
          retention-days: 30

      # ==================== 第十一步：编译后信息 ====================
      - name: 编译完成总结
        if: success()
        run: |
          echo "========================================"
          echo "       编译完成！"
          echo "========================================"
          echo ""
          echo "📦 Debug APK: ${{ env.APK_NAME }}"
          echo "📏 Debug APK 大小: $(numfmt --to=iec $APK_SIZE)"
          echo ""
          echo "📦 Release APK: ${{ env.RELEASE_APK_NAME }}"
          echo "📏 Release APK 大小: $(numfmt --to=iec $RELEASE_APK_SIZE)"
          echo "🔧 提交哈希: ${{ github.sha }}"
          echo "📅 编译时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""
          echo "=== 磁盘空间 ==="
          df -h /
          echo ""
          echo "=== 编译耗时 ==="
          echo "请查看工作流运行时间"
          echo ""
          echo "🎉 编译成功！Debug 和 Release APK 已上传到 Artifacts"

      # ==================== 第十二步：创建 Release ====================
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ${{ env.RELEASE_APK_PATH }}
            ${{ env.APK_PATH }}
          generate_release_notes: true
          body: |
            ## OpenWrt管家 ${{ github.ref_name }}

            ### 📦 下载
            - **Release APK (推荐)**: ${{ env.RELEASE_APK_NAME }}
            - **Debug APK**: ${{ env.APK_NAME }}

            ### 🔧 构建信息
            - 提交: ${{ github.sha }}
            - 编译时间: UTC

            ### 📋 变更内容
            - 新增：AI 智能诊断（Google Gemini）
            - 界面本地化：阿拉伯语 + 英语
            - 新增 OpenWrt 23.05.0 - 23.05.6 版本支持
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
